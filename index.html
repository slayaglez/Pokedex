<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="pagina">
    <div class="contenedor">
      <h1>
        <img
          class="titulo__imagen"
          src="assets/img/pokedexLogoTransparent.png"
          alt="Pokédex"
        >
      </h1>

      <p class="introduccion">
        Pulsa el botón para cargar los 151 Pokémon o busca por nombre / número!
      </p>

      <form id="formulario-busqueda" class="buscador">
        <label for="busqueda">Nombre o número</label>

        <div class="buscador__controles">
          <input
            id="busqueda"
            name="busqueda"
            type="text"
            placeholder="Ejemplo: pikachu o 25"
            autocomplete="off"
          >

          <button class="boton" type="submit">Buscar</button>
        </div>
      </form>

      <p id="mensaje" class="mensaje" aria-live="polite"></p>

      <section id="resultado" class="resultado"></section>
    </div>

    <button id="boton-cargar" class="boton boton--cargar" type="button">Invocar Pokémon!</button>

    <section id="cuadricula" class="cuadricula"></section>
  </main>

  <script src="js/Pokemon.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
